version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: warranty-backend
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: "file:/app/data/prod.db"
      JWT_SECRET: "${JWT_SECRET:-change-this-secret-in-production-minimum-32-chars}"
      JWT_EXPIRES_IN: "8h"
      UPLOAD_MAX_SIZE_MB: "10"
      UPLOAD_MAX_PAGES: "100"
      UPLOADS_DIR: "/app/uploads"
      CORS_ORIGIN: "http://localhost:80"
      ADMIN_SETUP_TOKEN: "${ADMIN_SETUP_TOKEN:-change-this-token}"
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: warranty-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
  backend_uploads:
