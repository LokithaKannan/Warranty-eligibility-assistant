name: CI — Warranty Eligibility Assistant

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — TypeScript Check & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations (test)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: file:./test-ci.db

      - name: TypeScript check
        run: npm run lint

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: file:./dev.db
          JWT_SECRET: ci-test-secret-key-for-github-actions-pipeline
          JWT_EXPIRES_IN: 1h
          UPLOAD_MAX_SIZE_MB: "10"
          UPLOAD_MAX_PAGES: "100"
          UPLOADS_DIR: ./uploads
          CORS_ORIGIN: http://localhost:5173
          ADMIN_SETUP_TOKEN: ci-test-setup-token

      - name: Build
        run: npm run build

  frontend:
    name: Frontend — TypeScript Check & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Build
        run: npm run build
